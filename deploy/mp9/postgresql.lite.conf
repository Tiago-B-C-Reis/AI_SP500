# AI_SP500 analytics Postgres — HP MP9 G2, 16 GB RAM, SSD
#
# Budget: ~3 GB for Postgres, leaving room for batch jobs, training and the
# migrated UIs. Sized for a handful of connections running analytical queries
# over ~3.5 M rows, NOT for high concurrency.

listen_addresses = '*'
max_connections = 30              # n8n + pgAdmin + batch jobs. Small on purpose:
                                  # each backend is a process, and work_mem is per-node.

# ---------- memory ----------
shared_buffers = 1GB              # ~1/3 of the 3 GB container limit
effective_cache_size = 6GB        # a hint to the planner, not an allocation:
                                  # what the OS page cache is likely to hold
work_mem = 24MB                   # per sort/hash NODE, not per query. A query with
                                  # 4 sorts × 5 backends could reach 480 MB — hence
                                  # the low ceiling. The Gold job raises it per-session
                                  # with SET LOCAL (see sql/002_silver_to_gold.sql).
maintenance_work_mem = 256MB      # VACUUM, CREATE INDEX
temp_buffers = 16MB

# ---------- write path ----------
wal_level = replica
max_wal_size = 2GB                # 128 GB disk — keep WAL bounded
min_wal_size = 512MB
checkpoint_completion_target = 0.9   # spread checkpoint I/O rather than spiking
wal_compression = on              # cheap on CPU, less disk written
synchronous_commit = on           # this is the only copy of derived data; keep it durable

# ---------- planner: SSD ----------
random_page_cost = 1.1            # near seq_page_cost — NVMe/SSD has no seek penalty
effective_io_concurrency = 200
default_statistics_target = 100

# ---------- parallelism ----------
# Window functions over the full price history benefit from parallel scans, but
# this CPU is shared with batch jobs. Two workers per gather is the sweet spot.
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ---------- autovacuum ----------
# Gold rebuilds churn rows daily. Default thresholds are too lazy for that pattern.
autovacuum = on
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_naptime = 30s

# ---------- observability ----------
log_min_duration_statement = 5000    # log anything over 5 s — at this scale that is a bug
log_checkpoints = on
log_autovacuum_min_duration = 10000
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'                     # all pipeline timestamps are UTC. Do not change.

datestyle = 'iso, mdy'
lc_messages = 'C'
default_text_search_config = 'pg_catalog.english'
