# AI_SP500 — data plane on the HP MP9 G2 (Ubuntu Server, 16 GB, 128 GB disk)
#
#   docker compose up -d                      # Postgres only
#   docker compose --profile migrated up -d    # + the three UIs moved off TrueNAS
#
# Batch jobs are NOT services here. They are systemd oneshot units (see ./systemd/)
# so that nothing related to the pipeline is resident between runs.

name: ai-sp500

services:
  postgres:
    image: postgres:16-alpine
    container_name: sp500-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aisp500}
      POSTGRES_USER: ${POSTGRES_USER:-sp500}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Data checksums cost ~2% write throughput and make silent corruption detectable.
      # This box has no ZFS underneath it, so Postgres has to notice bit rot itself.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql.lite.conf:/etc/postgresql/postgresql.conf:ro
      # Schema only, applied on FIRST init. 002_silver_to_gold.sql is deliberately
      # not mounted here — it is a recurring transform run by sp500-build-gold, not
      # a bootstrap step. Later schema changes:
      #   psql -h mp9.lan -U sp500 -d aisp500 -f sql/00X_....sql
      - ../../sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ports:
      # Exposed on the LAN so n8n on the TrueNAS can write news rows.
      # Restrict with your firewall: ufw allow from <truenas-ip> to any port 5432
      - "5432:5432"
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sp500} -d ${POSTGRES_DB:-aisp500}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # Services migrated off TrueNAS to reclaim RAM. Each is a stateless UI that
  # reaches its backend over HTTP — no data moves, and the move is reversible.
  # ---------------------------------------------------------------------------

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    profiles: [migrated]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *logging

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    profiles: [migrated]
    restart: unless-stopped
    environment:
      # MongoDB itself stays on the TrueNAS — only this UI moves.
      ME_CONFIG_MONGODB_SERVER: ${MONGO_HOST:-truenas.lan}
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:?set ME_USER in .env}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:?set ME_PASSWORD in .env}
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits: { memory: 256M }
    logging: *logging

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    profiles: [migrated]
    restart: unless-stopped
    environment:
      # The GPU stays on the TrueNAS. Only the frontend moves.
      OLLAMA_BASE_URL: http://${TRUENAS_HOST:-truenas.lan}:11434
      WEBUI_AUTH: "True"
    volumes:
      - openwebui:/app/backend/data
    ports:
      - "3000:8080"
    deploy:
      resources:
        limits: { memory: 1G }
    logging: *logging

volumes:
  pgdata:
  pgadmin:
  openwebui:
