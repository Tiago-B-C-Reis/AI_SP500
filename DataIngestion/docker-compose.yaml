version: '3.8'

# 1. Define a shared configuration block (so we don't repeat code)
x-app-config: &default-app
  image: tiagobcr/sp500-data-ingestion_arm64:latest
  container_name: sp500-ingestion-app
  depends_on:
    postgres-logging:
      condition: service_healthy
  env_file:
    - .env # Load environment variables (AWS credentials, etc.)
  environment:
    # Map to variables expected by logger.py
    POSTGRES_HOST: postgres-logging
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${LOGGING_DB_NAME:-ingestion_logs}
    POSTGRES_USER: ${LOGGING_DB_USER:-logger_user}
    POSTGRES_PASSWORD: ${LOGGING_DB_PASSWORD:-logger_password}
    # Ensure other vars are passed if not in .env
    REGION_NAME: ${REGION_NAME}
    BUCKET_NAME: ${BUCKET_NAME}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
  networks:
    - sp500_network

services:
  # Persistent Logging Database
  postgres-logging:
    image: postgres:13
    container_name: sp500-ingestion-logging-db
    environment:
      POSTGRES_USER: ${LOGGING_DB_USER:-logger_user}
      POSTGRES_PASSWORD: ${LOGGING_DB_PASSWORD:-logger_password}
      POSTGRES_DB: ${LOGGING_DB_NAME:-ingestion_logs}
    ports:
      - "5433:5432" # Host port 5433
    volumes:
      - postgres_logging_data:/var/lib/postgresql/data
    networks:
      - sp500_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${LOGGING_DB_USER:-logger_user} -d ${LOGGING_DB_NAME:-ingestion_logs}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 2. Service for Script A
  ingestion-weekly:
    <<: *default-app
    container_name: ingestion-weekly
    command: [ "python", "getRequesterWeekly.py" ]

  # 3. Service for Script B (AI)
  ingestion-ai-1:
    <<: *default-app
    container_name: ingestion-ai-1
    command: [ "python", "getRequesterDailyAI.py" ]

  # 4. Service for Script C (AI - Parallel Instance)
  ingestion-ai-2:
    <<: *default-app
    container_name: ingestion-ai-2
    command: [ "python", "getRequesterWeeklyAI.py" ]

networks:
  sp500_network:
    name: sp500_network
    driver: bridge

volumes:
  postgres_logging_data:
